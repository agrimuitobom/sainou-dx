# data/*.js の書きかたを自動チェックします（カンマ抜けなどを公開前に発見）。
name: Check data files

on:
  push:
    paths: ["data/**", "scripts/**", ".github/workflows/check-data.yml"]
  pull_request:
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-data.mjs
